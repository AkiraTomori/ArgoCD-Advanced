apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: jvm-dashboard
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://grafana.com/api/dashboards/4701/revisions/10/download"
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
